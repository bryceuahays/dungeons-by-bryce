<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secrets: DM Only</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121419}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #E0AE52;outline-offset:2px}
a{color:#E0AE52}a:hover{color:#F2C979}
</style>
</helmet>
<div style="width: 100%; min-height: 1900px; box-sizing: border-box; background: #121419; color: #EDE7DA; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column">
<dc-import name="HubTop" active="secrets" mode="dm" hint-size="100%,166px"></dc-import>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 24px 28px; flex: 1">
<div style="flex: 1 1 280px; max-width: 100%"><dc-import name="Sidebar" mode="dm" hint-size="100%,1300px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 36px; font-weight: 600">Secrets</h1>
<p style="margin: 4px 0 0; color: #C9B8EC">Only you can see this page. Everything hidden across the hub, and when it comes out.</p>
</div>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; background: #E0AE52; color: #1A1408; border: none; font-size: 14px; font-weight: 600">+ Add plot secret</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-label="Reveal schedule" style="flex: 999 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="background: #1B1E26; border: 1px solid #2E3341; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 22px; font-weight: 600">{{g.title}}</h2><span style="font-size: 13px; color: #A9A396">{{g.sub}}</span></div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<article style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; padding: 12px 14px; border-radius: 10px; background: #1E1A28; border: 1px dashed #7A68A3">
<div style="min-width: 0; flex: 1 1 240px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #C9B8EC">{{it.type}}</span>
<div style="font-weight: 600">{{it.name}}</div>
<div style="font-size: 13px; color: #A9A396">{{it.note}}</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="min-height: 40px; padding: 0 12px; border-radius: 8px; background: #2A2438; color: #EDE7DA; border: 1px solid #5B4E7A; font-size: 13px">Change session</button>
<button type="button" style="min-height: 40px; padding: 0 12px; border-radius: 8px; background: #B39DDB; color: #160F24; border: none; font-size: 13px; font-weight: 600">Reveal now</button>
</div>
</article>
</sc-for>
</div>
</sc-for>
</section>

<section aria-label="Messages from players" style="flex: 1 1 300px; max-width: 100%; box-sizing: border-box; background: #1B1E26; border: 1px solid #2E3341; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 22px; font-weight: 600">From your players</h2><span style="font-size: 12px; font-weight: 700; color: #1A1408; background: #E0AE52; border-radius: 999px; padding: 1px 8px">2 new</span></div>
<sc-for list="{{messages}}" as="m" hint-placeholder-count="3">
<article style="{{m.style}}">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span style="font-weight: 600">{{m.from}}</span><span style="color: #A9A396">{{m.when}}</span></div>
<p style="margin: 0; font-size: 14px; color: #CFC8B8">{{m.text}}</p>
<div style="display: flex; gap: 8px"><button type="button" style="min-height: 36px; padding: 0 10px; border-radius: 8px; background: #232733; color: #EDE7DA; border: 1px solid #3A4050; font-size: 13px">Reply</button><button type="button" style="min-height: 36px; padding: 0 10px; border-radius: 8px; background: transparent; color: #CFC8B8; border: 1px solid #3A4050; font-size: 13px">Save as secret</button></div>
</article>
</sc-for>
</section>
</div>
</main>
</div>
<div style="padding: 0 28px 28px"><dc-import name="Timeline" mode="dm" hint-size="100%,260px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    var msg = 'display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; ';
    return {
      groups: [
        { title: 'Session 4', sub: 'Goes live when the session starts', items: [
          { type: 'NPC', name: '[NPC name]', note: 'Players will see: name and portrait' },
          { type: 'Lore · Places', name: '[Place name]', note: 'Also adds a pin to the Map' },
          { type: 'Quest objective', name: '[Hidden objective]', note: 'On quest: [Main quest]' },
          { type: 'Per-player reveal', name: '[Vision only one player sees]', note: 'Only [Player character 2] will see this' }
        ] },
        { title: 'Session 5', sub: 'Planned', items: [
          { type: 'NPC', name: '[Mysterious patron]', note: 'Players will see: everything' },
          { type: 'Relationship', name: '[NPC name] is secretly tied to [Faction]', note: 'Adds a line to the Relationship web' }
        ] },
        { title: 'Unscheduled', sub: 'Reveal whenever it fits', items: [
          { type: 'Plot secret', name: '[What lies beneath the ruins]', note: 'Linked to: [Ruins]' },
          { type: 'Player backstory', name: '[Secret from a player]', note: 'From [Player character 2]' }
        ] }
      ],
      messages: [
        { from: '[Player character 2]', when: '2 days ago', text: '[A backstory secret the player wants woven in.]', style: msg + 'background: #2A2618; border: 1px solid #5A4A26;' },
        { from: '[Player character 3]', when: 'Yesterday', text: '[A sneaky plan for next session.]', style: msg + 'background: #2A2618; border: 1px solid #5A4A26;' },
        { from: '[Player character 1]', when: 'Last week', text: '[An earlier message, already read.]', style: msg + 'background: #20232C; border: 1px solid transparent;' }
      ]
    };
  }
}
</script>
</body>
</html>
