<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #EDE7DA; font-size: 15px; line-height: 1.5; background: #16181F">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px; padding: 14px 28px; border-bottom: 1px solid #2E3341">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #232733; border: 1px solid #2E3341; display: flex; align-items: center; justify-content: center; color: #E0AE52">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"></path><path d="M12 2L7 11h10z"></path><path d="M3 7l4 4M21 7l-4 4M7 11l5 11 5-11"></path></svg>
</div>
<div>
<div style="font-family: Spectral, Georgia, serif; font-size: 23px; font-weight: 600; line-height: 1.15">[Campaign name]</div>
<div style="font-size: 13px; color: #A9A396">Next up: Session 4 · DM: [DM name]</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<div role="search" style="position: relative; display: flex; align-items: center">
<label for="hub-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search the hub</label>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9A396" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 12px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="hub-search" type="search" placeholder="Search the hub" value="{{query}}" style="width: 220px; min-height: 44px; padding: 0 12px 0 36px; box-sizing: border-box; border-radius: 999px; background: #1B1E26; border: 1px solid #3A4050; color: #EDE7DA; font: inherit; font-size: 14px">
</div>
<sc-if value="{{dm}}" hint-placeholder-val="{{true}}">
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; background: #232733; color: #EDE7DA; border: 1px solid #3A4050; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>Push handout</button>
</sc-if>
<sc-if value="{{dm}}" hint-placeholder-val="{{true}}">
<a href="LiveSession.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 8px; background: #3A1F1F; color: #F5C2B3; border: 1px solid #7A3A33; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #E8957D"></span>Go live</a>
<a href="Settings.dc.html" aria-label="Campaign settings" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 8px; background: #232733; color: #EDE7DA; border: 1px solid #3A4050; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></a>
</sc-if>
<sc-if value="{{player}}" hint-placeholder-val="{{false}}">
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; background: #232733; color: #EDE7DA; border: 1px solid #3A4050; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>Message DM</button>
</sc-if>
<div role="group" aria-label="Hub mode" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #1B1E26; border: 1px solid #2E3341">
<a href="{{editorHref}}" aria-current="{{editorCurrent}}" style="{{editorStyle}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>Page editor</a>
<a href="{{playerHref}}" aria-current="{{playerCurrent}}" style="{{playerStyle}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>View as player</a>
</div>
</div>
</header>
<nav aria-label="Hub pages" style="display: flex; flex-wrap: wrap; gap: 2px; padding: 0 20px; border-bottom: 1px solid #2E3341">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="10">
<a href="{{t.href}}" aria-current="{{t.current}}" style="{{t.style}}">{{t.label}}<sc-if value="{{t.dmOnly}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #C9B8EC; border: 1px solid #5B4E7A; border-radius: 999px; padding: 1px 7px">DM only</span></sc-if></a>
</sc-for>
</nav>
<sc-if value="{{dm}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 28px; background: #1E1A28; border-bottom: 1px solid #3A3150; font-size: 13px; color: #D6CBEF">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
<span>Editing. Dashed purple items are hidden from players. Scheduled reveals go live when that session starts.</span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["welcome","npcs","lore","combat","players","map","quests","loot","relations","secrets","settings","people","search","live"],"default":"welcome"},"query":{"editor":"text","default":""},"mode":{"editor":"enum","options":["dm","player"],"default":"dm"},"$preview":{"width":1440,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'welcome';
    var dm = (this.props.mode ?? 'dm') === 'dm';
    var defs = [
      { id: 'welcome', label: 'Welcome', d: 'WelcomeDM.dc.html', p: 'Welcome.dc.html' },
      { id: 'npcs', label: 'NPCs', f: 'NPCs.dc.html' },
      { id: 'lore', label: 'Lore', f: 'Lore.dc.html' },
      { id: 'combat', label: 'Combat', d: 'CombatDM.dc.html', p: 'CombatPlayer.dc.html' },
      { id: 'players', label: 'Players', f: 'Players.dc.html' },
      { id: 'map', label: 'Map', f: 'Map.dc.html' },
      { id: 'quests', label: 'Quest log', f: 'Quests.dc.html' },
      { id: 'loot', label: 'Party loot', f: 'Loot.dc.html' },
      { id: 'relations', label: 'Relationships', f: 'Relations.dc.html' },
      { id: 'secrets', label: 'Secrets', f: 'Secrets.dc.html', dmOnly: true }
    ];
    var base = 'min-height: 48px; padding: 0 14px; border-bottom: 2px solid transparent; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; text-decoration: none;';
    var tabs = defs.filter(function (d) { return dm || !d.dmOnly; }).map(function (d) {
      var on = d.id === active;
      return {
        label: d.label, dmOnly: !!d.dmOnly,
        href: d.f || (dm ? d.d : d.p),
        current: on ? 'page' : 'false',
        style: base + (on ? ' color: #EDE7DA; border-bottom-color: #E0AE52;' : ' color: #A9A396;')
      };
    });
    var extra = {
      settings: { f: 'Settings.dc.html', dmOnly: true },
      people: { f: 'SettingsPeople.dc.html', dmOnly: true },
      search: { f: 'Search.dc.html' },
      live: { d: 'LiveSession.dc.html', p: 'Welcome.dc.html' }
    };
    var cur = defs.filter(function (d) { return d.id === active; })[0] || extra[active] || defs[0];
    var mBase = 'min-height: 40px; padding: 0 14px; border-radius: 7px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; text-decoration: none;';
    var on = mBase + ' background: #E0AE52; color: #1A1408;';
    var off = mBase + ' background: transparent; color: #C9C2B3;';
    return {
      dm: dm, player: !dm, tabs: tabs, query: this.props.query ?? '',
      editorHref: cur.f || cur.d, playerHref: (cur.dmOnly ? 'Welcome.dc.html' : (cur.f || cur.p)),
      editorCurrent: dm ? 'true' : 'false', playerCurrent: dm ? 'false' : 'true',
      editorStyle: dm ? on : off, playerStyle: dm ? off : on
    };
  }
}
</script>
</body>
</html>
