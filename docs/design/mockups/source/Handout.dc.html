<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Handout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121419}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #E0AE52;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #121419; color: #EDE7DA; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<dc-import name="HubTop" active="combat" mode="player" hint-size="100%,126px"></dc-import>
<div aria-hidden="true" style="display: flex; gap: 24px; padding: 24px 28px">
<div style="width: 300px; height: 700px; border-radius: 14px; background: #1B1E26; border: 1px solid #2E3341"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px">
<div style="height: 90px; border-radius: 12px; background: #2A2618; border: 1px solid #5A4A26"></div>
<div style="height: 320px; border-radius: 12px; background: #1C2620; border: 1px solid #2E3341"></div>
<div style="height: 200px; border-radius: 14px; background: #1B1E26; border: 1px solid #2E3341"></div>
</div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(9, 10, 13, 0.8); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="ho-title" style="width: 640px; box-sizing: border-box; background: #1B1E26; border: 1px solid #5A4A26; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5)">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div>
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #E0AE52">The DM shared a handout</div>
<h2 id="ho-title" style="margin: 2px 0 0; font-family: Spectral, Georgia, serif; font-size: 28px; font-weight: 600">[Handout name]</h2>
</div>
<button type="button" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 10px; background: #232733; border: 1px solid #3A4050; color: #EDE7DA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="height: 340px; border-radius: 12px; background: #2A2618; border: 1px solid #5A4A26; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #CDBB8E; font-size: 14px">
<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 17l-5-5-9 8"></path></svg>
[Letter, map or portrait image]
</div>
<p style="margin: 0; color: #CFC8B8">[Optional caption from the DM, e.g. "Found tucked inside the captain's coat."]</p>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 13px; color: #A9A396">Shown to everyone at the table · Session 4</span>
<div style="display: flex; gap: 8px">
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; background: #232733; color: #EDE7DA; border: 1px solid #3A4050; font-size: 14px">Close</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; background: #E0AE52; color: #1A1408; border: none; font-size: 14px; font-weight: 600">Keep in my handouts</button>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
