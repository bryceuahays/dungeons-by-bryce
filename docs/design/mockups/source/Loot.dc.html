<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Party Loot: Player View</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121419}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #E0AE52;outline-offset:2px}
a{color:#E0AE52}a:hover{color:#F2C979}
</style>
</helmet>
<div style="width: 100%; min-height: 1900px; box-sizing: border-box; background: #121419; color: #EDE7DA; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column">
<dc-import name="HubTop" active="loot" mode="player" hint-size="100%,126px"></dc-import>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 24px 28px; flex: 1">
<div style="flex: 1 1 280px; max-width: 100%"><dc-import name="Sidebar" mode="player" hint-size="100%,1200px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 36px; font-weight: 600">Party loot</h1>
<p style="margin: 4px 0 0; color: #A9A396">Shared treasure, and who is carrying what.</p>
</div>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; background: #232733; color: #EDE7DA; border: 1px solid #3A4050; font-size: 14px">+ Log new loot</button>
</div>

<section aria-label="Party funds" style="background: #1B1E26; border: 1px solid #2E3341; border-radius: 14px; padding: 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(80px, 1fr)); gap: 10px; flex: 1 1 380px">
<sc-for list="{{coins}}" as="c" hint-placeholder-count="4">
<div style="padding: 10px 12px; border-radius: 10px; background: #20232C; text-align: center"><div style="font-size: 12px; color: #A9A396">{{c.label}}</div><div style="font-family: Spectral, Georgia, serif; font-size: 24px; font-weight: 600">{{c.value}}</div></div>
</sc-for>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; background: #232733; color: #EDE7DA; border: 1px solid #3A4050; font-size: 14px">Add or spend</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; background: #E0AE52; color: #1A1408; border: none; font-size: 14px; font-weight: 600">Split evenly</button>
</div>
</section>

<section aria-label="Items" style="background: #1B1E26; border: 1px solid #2E3341; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<h2 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 22px; font-weight: 600">Items</h2>
<div role="group" aria-label="Filter items" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button type="button" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button></sc-for>
</div>
</div>
<div style="overflow-x: auto; border: 1px solid #2E3341; border-radius: 12px">
<table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px">
<thead><tr style="background: #20232C; text-align: left; color: #A9A396; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase">
<th scope="col" style="padding: 10px 14px; font-weight: 600">Item</th><th scope="col" style="padding: 10px 14px; font-weight: 600">Held by</th><th scope="col" style="padding: 10px 14px; font-weight: 600">Found</th><th scope="col" style="padding: 10px 14px; font-weight: 600"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Action</span></th>
</tr></thead>
<tbody>
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<tr style="border-top: 1px solid #2E3341">
<td style="padding: 10px 14px"><div style="font-weight: 600">{{it.name}}</div><div style="{{it.tagStyle}}">{{it.tag}}</div></td>
<td style="padding: 10px 14px; color: #CFC8B8">{{it.holder}}</td>
<td style="padding: 10px 14px; color: #A9A396">{{it.found}}</td>
<td style="padding: 10px 14px; text-align: right"><button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 8px; background: #232733; color: #EDE7DA; border: 1px solid #3A4050; font-size: 13px">{{it.action}}</button></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>

<section aria-label="Loot history" style="background: #1B1E26; border: 1px solid #2E3341; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 22px; font-weight: 600">Loot history</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{log}}" as="l" hint-placeholder-count="4">
<li style="display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 8px; background: #20232C; font-size: 14px"><span>{{l.text}}</span><span style="color: #A9A396; white-space: nowrap">{{l.when}}</span></li>
</sc-for>
</ol>
</section>
</main>
</div>
<div style="padding: 0 28px 28px"><dc-import name="Timeline" mode="player" hint-size="100%,240px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    var fb = 'min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; ';
    var filters = ['All', 'Unclaimed', 'Magic', 'Mine'].map(function (l, i) {
      return { label: l, pressed: i === 0 ? 'true' : 'false', style: fb + (i === 0 ? 'background: #EDE7DA; color: #121419; border: none; font-weight: 600;' : 'background: #20232C; color: #CFC8B8; border: 1px solid #2E3341;') };
    });
    var tag = 'font-size: 12px; ';
    return {
      coins: [{ label: 'Platinum', value: '[#]' }, { label: 'Gold', value: '[#]' }, { label: 'Silver', value: '[#]' }, { label: 'Copper', value: '[#]' }],
      filters: filters,
      items: [
        { name: '[Magic item]', tag: '[Rarity] · Attuned', tagStyle: tag + 'color: #B39DDB;', holder: '[Player character 1]', found: 'Session 2', action: 'Details' },
        { name: '[Unidentified ring]', tag: 'Unidentified · cast Identify to learn more', tagStyle: tag + 'color: #EAD39C;', holder: 'Unclaimed', found: 'Session 3', action: 'Claim' },
        { name: '[Potion of healing] ×3', tag: 'Consumable', tagStyle: tag + 'color: #A9A396;', holder: 'Shared', found: 'Session 1', action: 'Use one' },
        { name: '[Map fragment]', tag: 'Quest item · [Main quest]', tagStyle: tag + 'color: #E0AE52;', holder: '[Player character 2]', found: 'Session 3', action: 'Details' },
        { name: '[Gemstone] ×2', tag: 'Treasure · worth [#] gp', tagStyle: tag + 'color: #A9A396;', holder: 'Unclaimed', found: 'Session 3', action: 'Claim' }
      ],
      log: [
        { text: '[Player character 1] claimed [Magic item]', when: 'Session 3' },
        { text: 'Found [Unidentified ring], [Gemstone] ×2, [#] gp', when: 'Session 3' },
        { text: 'Spent [#] gp on supplies', when: 'Session 2' },
        { text: 'Found [Potion of healing] ×3', when: 'Session 1' }
      ]
    };
  }
}
</script>
</body>
</html>
