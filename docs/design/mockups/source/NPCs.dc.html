<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NPCs: DM Editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121419}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #E0AE52;outline-offset:2px}
a{color:#E0AE52}a:hover{color:#F2C979}
</style>
</helmet>
<div style="width: 100%; min-height: 1700px; box-sizing: border-box; background: #121419; color: #EDE7DA; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column">
<dc-import name="HubTop" active="npcs" mode="dm" hint-size="100%,166px"></dc-import>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 24px 28px; flex: 1">
<div style="flex: 1 1 280px; max-width: 100%"><dc-import name="Sidebar" mode="dm" hint-size="100%,1300px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 36px; font-weight: 600">NPCs</h1>
<p style="margin: 4px 0 0; color: #A9A396">Everyone the party has met. Choose how much players see of each.</p>
</div>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 8px; background: #E0AE52; color: #1A1408; border: none; font-size: 14px; font-weight: 600">+ Add NPC</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<label for="npc-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search NPCs</label>
<input id="npc-search" type="search" placeholder="Search NPCs" style="flex: 1 1 220px; min-height: 40px; padding: 0 12px; border-radius: 999px; background: #1B1E26; border: 1px solid #3A4050; color: #EDE7DA; font: inherit; font-size: 14px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button type="button" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px">
<sc-for list="{{npcs}}" as="n" hint-placeholder-count="5">
<article style="{{n.cardStyle}}">
<div style="position: relative; height: 140px; background: #232733; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #8E8879; font-size: 12px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-7 8-7s8 3 8 7"></path></svg>
Portrait
<sc-if value="{{n.portraitHidden}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 600; color: #D6CBEF; background: #1E1A28; border: 1px dashed #7A68A3; border-radius: 999px; padding: 1px 8px">Players don't see this</span></sc-if>
</div>
<div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 19px; font-weight: 600">{{n.name}}</h2>
<span style="{{n.attStyle}}">{{n.att}}</span>
</div>
<div style="font-size: 13px; color: #A9A396">{{n.role}}</div>
<p style="{{n.bgStyle}}">{{n.bg}}</p>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #A9A396"><span>{{n.met}}</span><a href="Relations.dc.html">{{n.links}}</a></div>
<div style="margin-top: auto; padding-top: 8px; border-top: 1px solid #2E3341; display: flex; flex-direction: column; gap: 4px">
<label for="{{n.id}}" style="font-size: 12px; color: #A9A396">Players see</label>
<select id="{{n.id}}" style="{{n.selStyle}}"><option>{{n.sees}}</option><option>Everything</option><option>Name and portrait</option><option>Name only</option><option>Nothing (hidden)</option><option>Only some players…</option></select>
</div>
</div>
</article>
</sc-for>
<button type="button" style="min-height: 280px; border-radius: 14px; border: 1.5px dashed #4A4F5E; background: transparent; color: #A9A396; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add NPC</button>
</div>
</main>
</div>
<div style="padding: 0 28px 28px"><dc-import name="Timeline" mode="dm" hint-size="100%,260px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    var fBase = 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; ';
    var filters = ['All', 'Allies', 'Neutral', 'Hostile', 'Hidden'].map(function (l, i) {
      return { label: l, pressed: i === 0 ? 'true' : 'false', style: fBase + (i === 0 ? 'background: #EDE7DA; color: #121419; border: none; font-weight: 600;' : 'background: #20232C; color: #CFC8B8; border: 1px solid #2E3341;') };
    });
    var attColor = { Ally: '#6CC4B3', Neutral: '#C9C2B3', Hostile: '#E8957D' };
    var list = [
      { name: '[NPC name]', role: '[Innkeeper]', att: 'Ally', bg: '[Short background the players have learned so far.]', met: 'Met in Session 1', links: '3 connections', sees: 'Everything', level: 3 },
      { name: '[NPC name]', role: '[Guard captain]', att: 'Neutral', bg: '[Short background the players have learned so far.]', met: 'Met in Session 2', links: '2 connections', sees: 'Everything', level: 3 },
      { name: '[NPC name]', role: '[Cult enforcer]', att: 'Hostile', bg: '[Background hidden: players only know the name and face.]', met: 'Met in Session 3', links: '1 connection', sees: 'Name and portrait', level: 2 },
      { name: '[NPC name]', role: '[Hooded stranger]', att: 'Neutral', bg: '[Only Player character 2 has seen them, in a dream.]', met: 'Seen by one player, Session 3', links: '1 connection', sees: 'Only [Player character 2]', level: 1 },
      { name: '[NPC name]', role: '[Mysterious patron]', att: 'Neutral', bg: '[Full background, visible only to you until revealed.]', met: 'Reveals at Session 5', links: '4 connections', sees: 'Nothing (hidden)', level: 0 }
    ];
    var npcs = list.map(function (n, i) {
      var hidden = n.level === 0;
      return {
        id: 'npc-vis-' + i, name: n.name, role: n.role, att: n.att, bg: n.bg, met: n.met, links: n.links + ' →', sees: n.sees,
        portraitHidden: n.level < 2 && !hidden,
        attStyle: 'font-size: 12px; font-weight: 600; color: ' + attColor[n.att] + ';',
        bgStyle: 'margin: 2px 0 0; font-size: 14px; ' + (n.level < 3 ? 'color: #C9B8EC; font-style: italic;' : 'color: #CFC8B8;'),
        selStyle: 'min-height: 40px; padding: 0 8px; border-radius: 8px; font: inherit; font-size: 14px; color: #EDE7DA; ' + (n.level < 3 ? 'background: #1E1A28; border: 1px dashed #7A68A3;' : 'background: #16181F; border: 1px solid #3A4050;'),
        cardStyle: 'border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; ' + (hidden ? 'background: #1E1A28; border: 1px dashed #7A68A3;' : 'background: #1B1E26; border: 1px solid #2E3341;')
      };
    });
    return { filters: filters, npcs: npcs };
  }
}
</script>
</body>
</html>
