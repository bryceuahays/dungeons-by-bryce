<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone Layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121419}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #E0AE52;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #121419; color: #EDE7DA; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: #16181F; border-bottom: 1px solid #2E3341">
<div><div style="font-family: Spectral, Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.2">[Campaign name]</div><div style="font-size: 12px; color: #A9A396">Lore</div></div>
<button type="button" aria-label="Message the DM" style="width: 44px; height: 44px; border-radius: 10px; background: #232733; border: 1px solid #3A4050; color: #EDE7DA; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg></button>
</header>
<div aria-hidden="true" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: Spectral, Georgia, serif; font-size: 26px; font-weight: 600">Lore</div>
<div style="height: 90px; border-radius: 12px; background: #1B1E26; border: 1px solid #2E3341"></div>
<div style="height: 90px; border-radius: 12px; background: #1B1E26; border: 1px solid #2E3341"></div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(9, 10, 13, 0.6)"></div>

<section aria-label="Character" style="position: absolute; left: 0; right: 0; bottom: 72px; box-sizing: border-box; background: #1B1E26; border-top: 1px solid #3A4050; border-radius: 20px 20px 0 0; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #4A4F5E; align-self: center"></div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #232733; border: 1px solid #3A4050"></div>
<div style="flex: 1; min-width: 0"><div style="font-family: Spectral, Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.2">[Player character 1]</div><div style="font-size: 12px; color: #A9A396">AC [#] · Speed [#] ft · Init +2</div></div>
<div style="text-align: right"><div style="font-size: 12px; color: #A9A396">HP</div><div style="font-weight: 600">24 / 31</div></div>
</div>
<div style="height: 6px; border-radius: 3px; background: #2E3341; overflow: hidden"><div style="width: 77%; height: 100%; background: #6CC4B3"></div></div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{abilities}}" as="a" hint-placeholder-count="6">
<button type="button" aria-label="Roll {{a.abbr}} check" style="min-height: 52px; border-radius: 10px; background: #20232C; border: 1px solid #2E3341; color: #EDE7DA; padding: 4px 0"><span style="display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; color: #A9A396">{{a.abbr}}</span><span style="display: block; font-family: Spectral, Georgia, serif; font-size: 18px; font-weight: 600; line-height: 1.1">{{a.mod}}</span></button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{skills}}" as="s" hint-placeholder-count="4">
<button type="button" style="min-height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; border-radius: 8px; background: #20232C; border: 1px solid transparent; color: #EDE7DA; font-size: 14px"><span>{{s.name}}</span><span style="font-weight: 600">{{s.mod}}</span></button>
</sc-for>
</div>
<button type="button" style="min-height: 40px; border-radius: 8px; background: transparent; border: 1px solid #3A4050; color: #CFC8B8; font-size: 14px">All 18 skills</button>
<div style="display: flex; gap: 6px">
<sc-for list="{{dice}}" as="d" hint-placeholder-count="6">
<button type="button" style="flex: 1; min-height: 44px; border-radius: 8px; background: #232733; border: 1px solid #3A4050; color: #EDE7DA; font-size: 13px; font-weight: 600">{{d}}</button>
</sc-for>
</div>
</section>

<nav aria-label="Hub pages" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #16181F; border-top: 1px solid #2E3341">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button type="button" aria-current="{{t.current}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var tb = 'min-height: 72px; background: transparent; border: none; font-size: 12px; font-weight: 600; ';
    var tabs = ['Home', 'Lore', 'Combat', 'Character', 'More'].map(function (l) {
      var on = l === 'Character';
      return { label: l, current: on ? 'true' : 'false', style: tb + (on ? 'color: #E0AE52; border-top: 2px solid #E0AE52;' : 'color: #A9A396; border-top: 2px solid transparent;') };
    });
    return {
      abilities: [['STR', '+0'], ['DEX', '+2'], ['CON', '+1'], ['INT', '+0'], ['WIS', '+1'], ['CHA', '-1']].map(function (a) { return { abbr: a[0], mod: a[1] }; }),
      skills: [{ name: 'Perception', mod: '+3' }, { name: 'Stealth', mod: '+4' }, { name: 'Insight', mod: '+3' }, { name: 'Acrobatics', mod: '+4' }],
      dice: ['d4', 'd6', 'd8', 'd10', 'd12', 'd20'],
      tabs: tabs
    };
  }
}
</script>
</body>
</html>
