<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quest Log: Player View</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121419}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #E0AE52;outline-offset:2px}
a{color:#E0AE52}a:hover{color:#F2C979}
</style>
</helmet>
<div style="width: 100%; min-height: 1900px; box-sizing: border-box; background: #121419; color: #EDE7DA; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column">
<dc-import name="HubTop" active="quests" mode="player" hint-size="100%,126px"></dc-import>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 24px 28px; flex: 1">
<div style="flex: 1 1 280px; max-width: 100%"><dc-import name="Sidebar" mode="player" hint-size="100%,1200px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div>
<h1 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 36px; font-weight: 600">Quest log</h1>
<p style="margin: 4px 0 0; color: #A9A396">What the party is working toward. Objectives tick off as the DM updates them.</p>
</div>
<div role="group" aria-label="Quest status" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A9A396">{{g.title}}</h2>
<sc-for list="{{g.quests}}" as="q" hint-placeholder-count="2">
<article style="{{q.cardStyle}}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 16px">
<div>
<h3 style="margin: 0; font-family: Spectral, Georgia, serif; font-size: 22px; font-weight: 600">{{q.name}}</h3>
<div style="font-size: 13px; color: #A9A396">Given by <a href="NPCs.dc.html">{{q.giver}}</a> · <a href="Map.dc.html">{{q.where}}</a> · {{q.since}}</div>
</div>
<button type="button" aria-pressed="{{q.trackPressed}}" style="{{q.trackStyle}}">{{q.trackLabel}}</button>
</div>
<p style="margin: 0; font-size: 14px; color: #CFC8B8">{{q.summary}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{q.objectives}}" as="o" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 10px; font-size: 14px">
<span aria-hidden="true" style="{{o.boxStyle}}">{{o.mark}}</span>
<span style="{{o.textStyle}}">{{o.text}}</span>
</li>
</sc-for>
</ul>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; border-top: 1px solid #2E3341; padding-top: 10px">
<span style="color: #A9A396">Reward: <span style="color: #EDE7DA">{{q.reward}}</span></span>
<span style="color: #A9A396">{{q.hiddenNote}}</span>
</div>
</article>
</sc-for>
</section>
</sc-for>
</main>
</div>
<div style="padding: 0 28px 28px"><dc-import name="Timeline" mode="player" hint-size="100%,240px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    var self = this;
    var tb = 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; ';
    var tabs = ['Active · 3', 'Completed · 2', 'Failed · 0'].map(function (l, i) {
      var on = i === self.state.tab;
      return { label: l, pressed: on ? 'true' : 'false', pick: function () { self.setState({ tab: i }); }, style: tb + (on ? 'background: #EDE7DA; color: #121419; border: none; font-weight: 600;' : 'background: #20232C; color: #CFC8B8; border: 1px solid #2E3341;') };
    });
    var obj = function (text, state) {
      var done = state === 'done', unknown = state === 'unknown';
      return {
        text: unknown ? '??? Not revealed yet' : text, mark: done ? '✓' : '',
        boxStyle: 'width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' + (done ? 'background: #6CC4B3; color: #0D1F1B;' : (unknown ? 'border: 1.5px dashed #5A6070;' : 'border: 1.5px solid #6E7385;')),
        textStyle: done ? 'color: #A9A396; text-decoration: line-through;' : (unknown ? 'color: #8E8879; font-style: italic;' : 'color: #EDE7DA;')
      };
    };
    var card = function (main, tracked) {
      return {
        cardStyle: 'display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 14px; ' + (main ? 'background: #1B1E26; border: 1px solid #5A4A26;' : 'background: #1B1E26; border: 1px solid #2E3341;'),
        trackPressed: tracked ? 'true' : 'false', trackLabel: tracked ? 'Tracking' : 'Track',
        trackStyle: 'min-height: 40px; padding: 0 14px; border-radius: 8px; font-size: 14px; ' + (tracked ? 'background: #E0AE52; color: #1A1408; border: none; font-weight: 600;' : 'background: #232733; color: #EDE7DA; border: 1px solid #3A4050;')
      };
    };
    var mk = function (base, extra) { for (var k in extra) base[k] = extra[k]; return base; };
    var active = [
      { title: 'Main quest', quests: [mk(card(true, true), { name: '[Main quest]', giver: '[NPC name]', where: '[Place name]', since: 'Since Session 1', summary: '[What the party has been asked to do, and why it matters.]', reward: '[Reward]', hiddenNote: '1 objective still hidden', objectives: [obj('[First objective]', 'done'), obj('[Second objective]', 'done'), obj('[Third objective]', 'open'), obj('', 'unknown')] })] },
      { title: 'Side quests', quests: [
        mk(card(false, true), { name: '[Side quest]', giver: '[NPC name]', where: '[Place name]', since: 'Since Session 2', summary: '[Short description of the side quest.]', reward: '???', hiddenNote: 'Reward revealed on completion', objectives: [obj('[Objective]', 'done'), obj('[Objective]', 'open')] }),
        mk(card(false, false), { name: '[Personal quest for Player character 2]', giver: '[NPC name]', where: '[Place name]', since: 'Since Session 3', summary: '[Tied to this character’s backstory.]', reward: '[Reward]', hiddenNote: '', objectives: [obj('[Objective]', 'open')] })
      ] }
    ];
    var completed = [
      { title: 'Completed', quests: [mk(card(false, false), { name: '[Finished quest]', giver: '[NPC name]', where: '[Place name]', since: 'Done in Session 2', summary: '[How it turned out.]', reward: '[Reward received]', hiddenNote: '', objectives: [obj('[Objective]', 'done'), obj('[Objective]', 'done')] })] }
    ];
    var empty = [{ title: 'Failed', quests: [] }];
    return { tabs: tabs, groups: this.state.tab === 0 ? active : (this.state.tab === 1 ? completed : empty) };
  }
}
</script>
</body>
</html>
