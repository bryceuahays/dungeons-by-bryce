<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside aria-label="Character sheet and dice" style="width: 100%; box-sizing: border-box; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #EDE7DA; font-size: 15px; line-height: 1.5; background: #1B1E26; border: 1px solid #2E3341; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6CC4B3"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Always visible</span>
<span style="font-size: 12px; color: #A9A396">Tap to roll</span>
</div>
<sc-if value="{{dm}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="sb-pc" style="font-size: 12px; color: #C9B8EC">DM: viewing sheet for</label>
<select id="sb-pc" style="min-height: 40px; padding: 0 10px; border-radius: 8px; background: #16181F; border: 1px solid #3A4050; color: #EDE7DA; font: inherit; font-size: 14px"><option>[Player character 1]</option><option>[Player character 2]</option><option>[Player character 3]</option></select>
</div>
</sc-if>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: #232733; border: 1px solid #3A4050; display: flex; align-items: center; justify-content: center; color: #A9A396"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-7 8-7s8 3 8 7"></path></svg></div>
<div style="min-width: 0">
<div style="font-family: Spectral, Georgia, serif; font-size: 19px; font-weight: 600; line-height: 1.2">[Player character 1]</div>
<div style="font-size: 13px; color: #A9A396">[Race] [Class] · Level [#]</div>
</div>
</div>
<div>
<div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px"><span style="color: #A9A396">Hit points</span><span style="font-weight: 600">24 / 31</span></div>
<div style="height: 8px; border-radius: 4px; background: #2E3341; overflow: hidden"><div style="width: 77%; height: 100%; background: #6CC4B3; border-radius: 4px"></div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #20232C; border-radius: 10px; padding: 8px; text-align: center"><div style="font-size: 11px; color: #A9A396; text-transform: uppercase; letter-spacing: 0.05em">AC</div><div style="font-size: 18px; font-weight: 600">[#]</div></div>
<div style="background: #20232C; border-radius: 10px; padding: 8px; text-align: center"><div style="font-size: 11px; color: #A9A396; text-transform: uppercase; letter-spacing: 0.05em">Speed</div><div style="font-size: 18px; font-weight: 600">[#] ft</div></div>
<button type="button" style="background: #20232C; border: 1px solid #2E3341; border-radius: 10px; padding: 8px; text-align: center; color: #EDE7DA; font: inherit; cursor: pointer"><span style="display: block; font-size: 11px; color: #A9A396; text-transform: uppercase; letter-spacing: 0.05em">Init</span><span style="display: block; font-size: 18px; font-weight: 600">+2</span></button>
</div>
<div>
<h2 style="margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A9A396">Attributes</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{abilities}}" as="a" hint-placeholder-count="6">
<button type="button" aria-label="Roll {{a.abbr}} check" style="background: #20232C; border: 1px solid #2E3341; border-radius: 10px; padding: 8px 4px; text-align: center; color: #EDE7DA; font: inherit; cursor: pointer">
<span style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #A9A396">{{a.abbr}}</span>
<span style="display: block; font-family: Spectral, Georgia, serif; font-size: 22px; font-weight: 600; line-height: 1.1">{{a.mod}}</span>
<span style="display: block; font-size: 12px; color: #A9A396">{{a.score}}</span>
</button>
</sc-for>
</div>
</div>
<div>
<div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A9A396">Skills</h2>
<span style="font-size: 12px; color: #A9A396">Prof. +2</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{skills}}" as="sk" hint-placeholder-count="18">
<button type="button" aria-label="Roll {{sk.name}}" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 8px; background: #20232C; border: 1px solid transparent; color: #EDE7DA; font: inherit; font-size: 13px; text-align: left; cursor: pointer">
<span aria-hidden="true" style="{{sk.dotStyle}}"></span>
<span style="flex: 1; min-width: 0; line-height: 1.2">{{sk.name}}</span>
<span style="font-weight: 600">{{sk.mod}}</span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; border-top: 1px solid #2E3341; padding-top: 12px">
<span style="color: #A9A396">Conditions</span>
<span style="background: #3A231C; color: #F5C2B3; border-radius: 999px; padding: 2px 10px">Poisoned · 2 rounds</span>
</div>
<section aria-label="Shared dice log" style="border-top: 1px solid #2E3341; padding-top: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #A9A396">Party rolls</h2>
<span style="font-size: 12px; color: #A9A396">Private rolls are marked</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{rolls}}" as="r" hint-placeholder-count="3">
<li style="{{r.style}}"><span style="min-width: 0"><span style="display: block; font-size: 12px; color: #A9A396">{{r.who}}</span><span style="display: block">{{r.what}}</span></span><span style="font-family: Spectral, Georgia, serif; font-size: 22px; font-weight: 600">{{r.total}}</span></li>
</sc-for>
</ul>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{dice}}" as="d" hint-placeholder-count="7">
<button type="button" style="min-height: 44px; border-radius: 8px; background: #232733; border: 1px solid #3A4050; color: #EDE7DA; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{d}}</button>
</sc-for>
</div>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0 0 4px; font-size: 12px; color: #A9A396">Who sees my next roll</legend>
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #16181F; border: 1px solid #2E3341">
<sc-for list="{{privacy}}" as="pv" hint-placeholder-count="3">
<button type="button" aria-pressed="{{pv.pressed}}" onClick="{{pv.pick}}" style="{{pv.style}}">{{pv.label}}</button>
</sc-for>
</div>
</fieldset>
</section>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dm","player"],"default":"player"},"$preview":{"width":300,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { priv: 1 }; }
  renderVals() {
    var dm = (this.props.mode ?? 'player') === 'dm';
    var abilities = [['STR', 10], ['DEX', 14], ['CON', 12], ['INT', 10], ['WIS', 13], ['CHA', 8]].map(function (a) {
      var m = Math.floor((a[1] - 10) / 2);
      return { abbr: a[0], score: a[1], mod: (m >= 0 ? '+' : '') + m };
    });
    var mods = {};
    abilities.forEach(function (a) { mods[a.abbr] = parseInt(a.mod, 10); });
    var prof = { Acrobatics: 1, Insight: 1, Perception: 1, Stealth: 1 };
    var skills = [['Acrobatics', 'DEX'], ['Animal Handling', 'WIS'], ['Arcana', 'INT'], ['Athletics', 'STR'], ['Deception', 'CHA'], ['History', 'INT'], ['Insight', 'WIS'], ['Intimidation', 'CHA'], ['Investigation', 'INT'], ['Medicine', 'WIS'], ['Nature', 'INT'], ['Perception', 'WIS'], ['Performance', 'CHA'], ['Persuasion', 'CHA'], ['Religion', 'INT'], ['Sleight of Hand', 'DEX'], ['Stealth', 'DEX'], ['Survival', 'WIS']].map(function (s) {
      var p = !!prof[s[0]];
      var v = mods[s[1]] + (p ? 2 : 0);
      return { name: s[0], mod: (v >= 0 ? '+' : '') + v, dotStyle: 'width: 7px; height: 7px; flex: none; border-radius: 50%; box-sizing: border-box; ' + (p ? 'background: #6CC4B3;' : 'border: 1.5px solid #5A6070;') };
    });
    var rollBase = 'display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 14px; ';
    var rolls = [
      { who: '[Player character 2]', what: 'Perception (15 + 2)', total: '17', style: rollBase + 'background: #20232C;' },
      { who: '[Player character 1]', what: 'Attack, shortsword (19 + 4)', total: '23', style: rollBase + 'background: #2A2618;' }
    ];
    var priv = rollBase + 'background: #1E1A28; border: 1px dashed #7A68A3;';
    if (dm) {
      rolls.push({ who: 'DM · hidden from players', what: 'Stealth, [Enemy A] (8 + 3)', total: '11', style: priv });
      rolls.push({ who: '[Player character 3] · rolled to DM only', what: 'Insight (12 + 3)', total: '15', style: priv });
    } else {
      rolls.push({ who: 'You · only the DM sees this', what: 'Insight (12 + 1)', total: '13', style: priv });
    }
    var self = this;
    var opts = dm ? ['Everyone', 'DMs only'] : ['Everyone', 'DM only', 'Just me'];
    var sel = this.state.priv ?? 1;
    var privacy = opts.map(function (o, i) {
      var on = i === sel;
      return { label: o, pressed: on ? 'true' : 'false', pick: function () { self.setState({ priv: i }); }, style: 'flex: 1; min-height: 40px; border-radius: 7px; border: none; font: inherit; font-size: 13px; cursor: pointer; ' + (on ? 'background: #B39DDB; color: #160F24; font-weight: 600;' : 'background: transparent; color: #CFC8B8;') };
    });
    return { dm: dm, abilities: abilities, skills: skills, rolls: rolls, privacy: privacy, dice: ['d4', 'd6', 'd8', 'd10', 'd12', 'd20', 'd100', 'Custom'] };
  }
}
</script>
</body>
</html>
