<title>To be a god: character builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: a character-select stage (portrait rail + looping video) followed by plain form steps, ending in a printed-looking sheet. Dark by design, matching the campaign hubs. */
:root{
  --void:#070914; --deep:#0c1020; --plate:#10152a; --plate2:#141a33; --line:#2a3152; --field:#0a0d1c;
  --vellum:#e9e2d0; --dim:#a8a4b4; --gold:#c8a45a; --ember:#e0672f; --star:#8fa7d6; --verd:#6fb3a0;
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  color-scheme:dark; box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0; background:var(--void); color:var(--vellum); font-family:var(--body); font-size:17px; line-height:1.6;
  background-image:radial-gradient(900px 520px at 12% -5%, rgba(200,164,90,.10), transparent 60%),radial-gradient(800px 600px at 95% 8%, rgba(224,103,47,.10), transparent 60%);
  background-attachment:fixed}
.wrap{max-width:1160px; margin:0 auto; padding-inline:20px; padding-block:0 90px}
h1,h2,h3,h4{font-family:var(--display); font-weight:400; line-height:1.15; margin:0; text-wrap:balance}
h1{font-size:clamp(1.9rem,4.4vw,2.8rem)}
h2{font-size:clamp(1.5rem,3.2vw,2rem); margin:26px 0 4px}
h3{font-size:1.3rem; margin:0 0 6px}
h4{font-size:1.08rem; color:var(--gold); margin:16px 0 4px}
p{margin:0 0 12px; max-width:72ch}
ul{margin:0 0 12px; padding-left:20px}
a{color:var(--star)}
.lede{color:var(--dim); font-style:italic; font-family:var(--display); font-size:1.1rem; margin-bottom:14px}
.who{color:var(--dim); font-size:.95rem}
.top{padding:26px 0 6px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; justify-content:space-between}
.top small{color:var(--dim)}

nav.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:rgba(7,9,20,.9); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.tabrow{max-width:1160px; margin:0 auto; padding:10px 20px; display:flex; gap:8px; align-items:center; overflow-x:auto}
.tab{font-family:var(--display); font-size:1.02rem; color:var(--dim); background:linear-gradient(180deg,var(--plate2),var(--deep)); border:1px solid var(--line); padding:7px 17px 8px; cursor:pointer; white-space:nowrap;
  clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
.tab:hover{color:var(--vellum)}
.tab[aria-selected="true"]{color:#1a1405; background:linear-gradient(180deg,#e3c47f,#b58f45); border-color:#e3c47f}
.tab.done:not([aria-selected="true"]){color:var(--verd)}
button:focus-visible,a:focus-visible,.tab:focus-visible{outline:2px solid var(--star); outline-offset:3px}

.plate{position:relative; background:linear-gradient(180deg,rgba(20,26,51,.92),rgba(12,16,32,.92)); border:1px solid var(--line); padding:18px 20px 14px; min-width:0}
.plate::before,.plate::after{content:""; position:absolute; width:12px; height:12px; border:1px solid var(--gold); opacity:.7; pointer-events:none}
.plate::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.plate::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.stack{display:grid; gap:16px}

.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px 14px}
.fields.wide{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
label.f{display:flex; flex-direction:column; gap:3px; font-size:.9rem; color:var(--dim)}
input,select,textarea{font:inherit; font-size:1rem; color:var(--vellum); background:var(--field); border:1px solid var(--line); padding:7px 9px; border-radius:2px; width:100%; min-width:0}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 2px rgba(200,164,90,.25)}
input[type=checkbox]{width:auto; accent-color:var(--gold)}
textarea{resize:vertical}
.act{font-family:var(--body); font-size:.95rem; color:var(--gold); background:rgba(200,164,90,.08); border:1px solid rgba(200,164,90,.6); padding:7px 15px; cursor:pointer; border-radius:2px}
.act:hover{background:rgba(200,164,90,.2)}
.act.big{font-family:var(--display); font-size:1.1rem; color:#1a1405; background:linear-gradient(180deg,#e3c47f,#b58f45); border-color:#e3c47f; padding:9px 22px}
.act.quiet{color:var(--dim); border-color:var(--line); background:transparent}
.navrow{display:flex; justify-content:space-between; gap:12px; margin-top:22px; flex-wrap:wrap}

/* character select */
.stage{display:grid; grid-template-columns:232px minmax(0,1fr); gap:18px; align-items:start; margin-top:14px}
.rail{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.rc{position:relative; padding:0; border:1px solid var(--line); background:var(--deep); cursor:pointer; overflow:hidden; aspect-ratio:5/6; color:var(--vellum); font:inherit}
.rc img{display:block; width:100%; height:100%; object-fit:cover; opacity:.62; transition:opacity .15s}
.rc span{position:absolute; left:0; right:0; bottom:0; padding:14px 6px 4px; font-family:var(--display); font-size:.98rem; text-align:center; background:linear-gradient(180deg,transparent,rgba(7,9,20,.92) 60%)}
.rc:hover img{opacity:.9}
.rc[aria-pressed="true"]{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 18px rgba(200,164,90,.35)}
.rc[aria-pressed="true"] img{opacity:1}
.rc[aria-pressed="true"] span{color:var(--gold)}
.screen{position:relative; border:1px solid var(--line); background:#000; aspect-ratio:16/9; max-width:100%}
.screen video{display:block; width:100%; height:100%; object-fit:contain; background:#000}
.screen .hint{position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--dim); font-family:var(--display); font-size:1.2rem; padding:20px}
.vbtn{position:absolute; right:8px; bottom:8px; font:inherit; font-size:.8rem; color:var(--vellum); background:rgba(7,9,20,.7); border:1px solid var(--line); padding:2px 10px; cursor:pointer; border-radius:2px}
@media (max-width:820px){ .stage{grid-template-columns:1fr} .rail{grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:96px; overflow-x:auto; padding-bottom:6px} }

.traits{list-style:none; padding:0; margin:0}
.traits li{padding:7px 0; border-bottom:1px solid var(--line)}
.traits li:last-child{border-bottom:0}
.traits b{font-weight:600}
details{border:1px solid var(--line); padding:8px 14px; background:rgba(12,16,32,.7)}
details summary{cursor:pointer; font-family:var(--display); font-size:1.1rem; color:var(--gold)}
details[open] summary{margin-bottom:6px}

.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.cc{font:inherit; text-align:left; color:var(--vellum); background:var(--deep); border:1px solid var(--line); padding:10px 12px; cursor:pointer}
.cc b{display:block; font-family:var(--display); font-weight:400; font-size:1.2rem}
.cc small{color:var(--dim)}
.cc:hover{border-color:var(--star)}
.cc[aria-pressed="true"]{border-color:var(--gold); box-shadow:inset 0 0 18px rgba(200,164,90,.22)}
.cc[aria-pressed="true"] b{color:var(--gold)}
.tag{font-size:.78rem; color:var(--verd); border:1px solid rgba(111,179,160,.5); padding:0 6px; border-radius:2px; white-space:nowrap}
.splist{display:grid; gap:0; max-height:60vh; overflow-y:auto; border:1px solid var(--line); background:rgba(12,16,32,.7)}
.splv{position:sticky; top:0; background:var(--plate2); color:var(--gold); font-family:var(--display); font-size:1.05rem; padding:4px 12px; border-bottom:1px solid var(--line); z-index:1}
.sp{display:block; width:100%; text-align:left; font:inherit; color:var(--vellum); background:transparent; border:0; border-bottom:1px solid var(--line); padding:7px 12px 7px 38px; cursor:pointer; position:relative}
.sp::before{content:""; position:absolute; left:12px; top:11px; width:14px; height:14px; border:1px solid var(--dim); border-radius:2px}
.sp[aria-pressed="true"]::before{background:var(--gold); border-color:var(--gold)}
.sp[aria-pressed="true"] b{color:var(--gold)}
.sp:hover{background:rgba(143,167,214,.08)}
.sp b{font-weight:600}
.sp small{color:var(--star); margin-left:6px}
.sp span{display:block; color:var(--dim); font-size:.92rem}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px}
.chip{font:inherit; font-size:.95rem; color:var(--dim); background:var(--deep); border:1px solid var(--line); padding:4px 13px; cursor:pointer; border-radius:999px}
.chip:hover{color:var(--vellum)}
.chip[aria-pressed="true"]{color:#1a1405; background:var(--gold); border-color:var(--gold)}
.chip[disabled]{opacity:.45; cursor:default}
.chip.lock{color:var(--verd); border-color:rgba(111,179,160,.6); cursor:default}
.count{color:var(--dim); font-size:.9rem}
.count.bad{color:var(--ember)}
.abil{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.ab{border:1px solid var(--line); padding:10px; display:grid; gap:6px}
.ab .tot{font-family:var(--display); font-size:1.9rem; color:var(--gold); line-height:1}
.ab .tot small{font-family:var(--body); font-size:.9rem; color:var(--dim); margin-left:6px}
.ab .parts{color:var(--dim); font-size:.85rem}

/* sheet */
.sheet h2{color:var(--gold)}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:8px; margin:12px 0}
.stat{border:1px solid var(--line); text-align:center; padding:8px 4px; color:var(--dim); font-size:.84rem; background:rgba(12,16,32,.8)}
.stat b{display:block; font-family:var(--display); font-size:1.75rem; color:var(--gold); font-weight:400; line-height:1.2}
.stat b.sm{font-size:1.05rem; line-height:2}
.sk{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:2px 18px; font-variant-numeric:tabular-nums}
.sk div{display:flex; justify-content:space-between; gap:8px; border-bottom:1px dotted var(--line); padding:2px 0}
.sk .p{color:var(--gold)}
.sk small{color:var(--dim)}
.opt{padding:9px 0; border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt p{margin:3px 0 0; max-width:none; color:var(--dim)}
.opt b{font-weight:600}
.badge{font-size:.78rem; border:1px solid var(--star); color:var(--star); padding:0 8px; border-radius:999px; margin-left:8px; white-space:nowrap}
.roll{color:var(--gold)}
.cgrid{display:grid; grid-template-columns:340px minmax(0,1fr); gap:22px; align-items:start}
.cleft{position:sticky; top:calc(env(safe-area-inset-top,0px) + 70px)}
.stats.c3{grid-template-columns:repeat(3,1fr)}
.pills{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 8px}
.pill{font:inherit; font-size:.92rem; color:var(--vellum); background:var(--deep); border:1px solid var(--star); padding:4px 12px; border-radius:999px; cursor:pointer}
.pill[aria-pressed="true"]{opacity:.4; text-decoration:line-through; border-color:var(--line)}
.cardline{border-left:3px solid var(--gold); padding:3px 0 3px 10px; margin:8px 0}
h3.cat{color:var(--gold); margin:22px 0 2px; border-bottom:1px solid var(--line); padding-bottom:4px}
h3.cat small{color:var(--dim); font-family:var(--body); font-size:.85rem}
#cList h3.cat:first-child{margin-top:8px}
@media (max-width:820px){ .cgrid{grid-template-columns:1fr} .cleft{position:static} }
.warn{border-left:3px solid var(--ember); background:rgba(224,103,47,.08); padding:10px 14px; margin:12px 0}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; word-break:break-all; height:90px}
.steps{counter-reset:s; list-style:none; padding:0}
.steps li{counter-increment:s; padding-left:38px; position:relative; margin:8px 0}
.steps li::before{content:counter(s); position:absolute; left:0; top:0; width:26px; height:26px; border:1px solid var(--gold); color:var(--gold); border-radius:50%; text-align:center; line-height:24px; font-family:var(--display)}
.pre{white-space:pre-wrap}
@media (max-width:600px){ body{font-size:16px} .plate{padding:16px 14px 12px} }
</style>

<nav class="tabs" aria-label="Steps"><div class="tabrow" role="tablist" id="tabs"></div></nav>

<div class="wrap">
  <header class="top">
    <h1>Build your character</h1>
    <small id="saveState">Your progress saves in this browser as you go.</small>
  </header>

  <section id="p-race" role="tabpanel">
    <p class="lede">Choose your people. Select a portrait to see them.</p>
    <div class="stage">
      <div class="rail" id="rail"></div>
      <div class="stack">
        <div class="screen">
          <video id="rv" muted loop playsinline preload="metadata"></video>
          <div class="hint" id="rvHint">Select one of the twelve peoples.</div>
          <button class="vbtn" id="rvBtn" hidden>Pause</button>
        </div>
        <div id="raceInfo"></div>
      </div>
    </div>
  </section>
  <section id="p-class" role="tabpanel" hidden></section>
  <section id="p-abil" role="tabpanel" hidden></section>
  <section id="p-skills" role="tabpanel" hidden></section>
  <section id="p-gear" role="tabpanel" hidden></section>
  <section id="p-spells" role="tabpanel" hidden></section>
  <section id="p-details" role="tabpanel" hidden></section>
  <section id="p-sheet" role="tabpanel" hidden></section>
  <section id="p-combat" role="tabpanel" hidden></section>

  <div class="navrow"><button class="act quiet" id="prev">Back</button><button class="act big" id="next">Next</button></div>

  <div class="plate" id="dmBox" hidden style="margin-top:40px">
    <h3>DM controls</h3>
    <p class="who">Only you see this box. It sets which race videos and descriptions every player sees.</p>
    <div class="chips"><button class="chip" data-phase="before">Before session negative</button><button class="chip" data-phase="after">After session negative</button></div>
    <p class="who" id="dmMsg"></p>
  </div>
</div>

<script>
const PLAYER_GUIDE='https://claude.ai/artifact/HpihFPH8RmmSz4LTTHqwW4';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ABS=[['str','Strength'],['dex','Dexterity'],['con','Constitution'],['int','Intelligence'],['wis','Wisdom'],['cha','Charisma']];
const ABN=Object.fromEntries(ABS);
const SKILLS=[['Acrobatics','dex'],['Animal Handling','wis'],['Arcana','int'],['Athletics','str'],['Deception','cha'],['History','int'],['Insight','wis'],['Intimidation','cha'],['Investigation','int'],['Medicine','wis'],['Nature','int'],['Perception','wis'],['Performance','cha'],['Persuasion','cha'],['Religion','int'],['Sleight of Hand','dex'],['Stealth','dex'],['Survival','wis']];
const ALLSK=SKILLS.map(s=>s[0]);
const sgn=n=>(n>=0?'+':'')+n;
const amod=v=>Math.floor((v-10)/2);

/* ---------- peoples ---------- */
/* trait: [name, text, {cost, uses, min, after}]  uses 'pb' = proficiency bonus per long rest. `after` text is only shown once the DM switches to "after session negative". */
const RACES=[
 {id:'human',vid:'human',name:'Human',size:'Medium',walk:30,line:'The most numerous people, and the most managed.',
  traits:[['Feat','One feat of your choice. Write it on the Details step.'],['Skill','Proficiency in one skill of your choice.']],up:'Expertise in one skill.',picks:{n:1,pool:'any'}},
 {id:'tortle',vid:'tortle',name:'Tortle',size:'Medium',walk:30,line:'Turtle-folk who wander their whole lives.',
  traits:[['Natural armor','Your AC is 17. You can\'t wear armor, but a shield still helps.'],['Claws','A natural weapon dealing 1d6 slashing.'],['Hold breath','Up to 1 hour.'],['Nature\'s intuition','Proficiency in one nature-related skill.'],['Shell defense','Action: withdraw into your shell for +4 AC. You are prone, your speed is 0, and you can do nothing else until you emerge as a bonus action.',{cost:'Action'}]],
  up:'Use your shell as a reaction when hit for +4 AC against that attack.',picks:{n:1,pool:['Animal Handling','Medicine','Nature','Perception','Stealth','Survival']},nat:{name:'Claws',die:'1d6',type:'slashing'}},
 {id:'aarakocra',vid:'aarakocra',two:true,name:'Aarakocra',size:'Medium',walk:30,line:['Bird-folk who are god\'s eyes.','Bird-folk who were the dead god\'s eyes.'],
  traits:[['Flight','From level 2, fly 30 feet while not wearing medium or heavy armor.',{min:2}],['Talons','A natural weapon dealing 1d6 slashing.'],['Wind caller','Cast gust of wind once per long rest.',{min:3,cost:'Action',uses:1}]],
  up:'Fly speed rises to 50 feet.',nat:{name:'Talons',die:'1d6',type:'slashing'}},
 {id:'kenku',vid:'kenku',two:true,name:'Kenku',size:'Medium',walk:30,line:['Corvid mimics who act as god\'s voice.','Corvid mimics who were once a god\'s voice.'],
  traits:[['Recall','Proficiency in two skills of your choice. When you make a check with a skill you are trained in, you can give yourself advantage. Uses equal your proficiency bonus per long rest.',{cost:'Free',uses:'pb'}],['Mimicry','Mimic sounds and voices you have heard.'],['Duplication','Copy handwriting and craftwork you have seen.']],
  up:'Copy one skill or tool proficiency you watched someone use that day.',picks:{n:2,pool:'any'}},
 {id:'hadozee',vid:'hadozee',name:'Hadozee',size:'Medium',walk:30,climb:30,line:'Gliding ape-folk who sail between worlds.',
  traits:[['Climber','Climb speed 30 feet.'],['Glide','When you fall, glide instead: move up to 5 feet sideways for every foot you drop, and take no falling damage.'],['Dexterous feet','Your feet work as hands.'],['Dodge','Reaction when you take damage: reduce it by 1d6 plus your proficiency bonus.',{cost:'Reaction',roll:(L,pb)=>(L>=7?'2d6':'1d6')+'+'+pb+' less damage'}]],
  up:'Your damage reduction becomes 2d6 plus proficiency bonus.'},
 {id:'ape',vid:'great_ape',two:true,name:'Great ape',size:'Medium',walk:30,climb:30,line:['The builders of god\'s temples.','The builders of the dead god\'s temples.'],
  traits:[['Climber','Climb speed 30 feet.'],['Dexterous feet','Your feet work as hands.'],['Dodge','Reaction when you take damage: reduce it by 1d6 plus your proficiency bonus.',{cost:'Reaction',roll:(L,pb)=>'1d6+'+pb+' less damage'}],['Powerful build','You count as Large for carrying, pushing, and lifting.']],
  up:'Advantage on grapples and shoves, and you climb at full speed while carrying or dragging a grappled creature.'},
 {id:'dragonborn',vid:'dragonborn',two:true,name:'Dragonborn',size:'Medium',walk:30,line:['Made in god\'s image.','Made in the dead god\'s image.'],upLvl:5,
  traits:[['Ancestry','Choose a damage type: acid, cold, fire, lightning, poison, force, necrotic, psychic, radiant, or thunder.'],['Resistance','You resist your ancestry\'s damage type.'],['Breath weapon','In place of one attack: a 15-foot cone or 30-foot line. Dexterity save for half damage. 1d10 damage, 2d10 from level 5.',{cost:'Action',uses:'pb',roll:(L,pb,D)=>'DC '+(8+pb+D.m.con)+' Dexterity save, '+(L>=5?'2d10':'1d10')}],['Dragonborn fury','+1 to attack rolls while at or below half your hit points.']],
  up:'Choose one: immunity to your damage type for a minute, a second breath that knocks back or incapacitates, or spectral wings for a minute. Each once per long rest.'},
 {id:'corrin',vid:'corrin',name:'Corrin',size:'Medium',walk:25,line:'Living coral that remembers its dead.',
  traits:[['Stone body','Your AC is 13 plus your Dexterity modifier when unarmored.'],['Tremor sense','You know the location of anything touching the same surface within 10 feet.'],['Reef memory','When you fail an attack, save, or check, add 1d6 to it.',{cost:'Free',uses:'pb',roll:L=>(L>=7?'+1d8':'+1d6')}]],
  up:'Reef memory becomes 1d8, and you can give it to an ally within 30 feet as a reaction.'},
 {id:'sough',vid:'sough',name:'Sough',size:'Medium',walk:35,line:'Woven grass around a core of soil.',
  traits:[['Type','Plant. Sough do not count as humanoid, so effects that only target humanoids do not affect them.'],['Woven form','Reshape your body freely and pass through gaps as narrow as 1 inch. Your gear does not come with you.'],['Blades','Unarmed strikes deal 1d6 slashing or piercing, using Strength or Dexterity.'],['Sap','When you hit with Blades, deal extra necrotic damage equal to your proficiency bonus and heal the same amount.',{cost:'Free',uses:'pb'}],['Thatch','Resistance to bludgeoning, vulnerability to fire.'],['Weave','Bonus action to switch state. Braided: advantage on Strength checks and saves, speed drops 10 feet. Loose: no change. Spread: Blades reach 10 feet but drop to 1d4, with disadvantage on Strength checks and saves.',{cost:'Bonus action'}],['Root','Bonus action on soil: speed becomes 0 and you can\'t be moved or knocked prone. Leaving costs nothing.',{cost:'Bonus action'}],['Seek the seam','Advantage on checks to find cracks, weak points, and hidden openings in stone and structures.'],['Ever-growing','On a short rest rooted in soil, roll one extra Hit Die for free.'],['Wither','You need an hour of sunlight and water each day. Each day without either drops you one step: (1) lose Sap and Ever-growing, (2) speed 30 feet and Blades 1d4, (3) lose bludgeoning resistance, (4) 1d6 damage each day that can\'t be healed. One hour with both resets you.',{after:' This applies to Sough god-slayers too.'}],['Parasite','When a parasitic plant gets in, make a DC 13 Constitution save. On a failure you lose Sap and Ever-growing and drop one Wither step each day regardless. Removing it yourself: one hour, DC 18 Medicine. Someone else: 10 minutes, DC 12. Lesser restoration also works.',{after:' Sough god-slayers are not immune.'}]],
  up:'Switch Weave for free once per turn, and Spread reaches 15 feet.',nat:{name:'Blades',die:'1d6',type:'slashing or piercing',fin:true}},

const COST={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
const ARRAY=[15,14,13,12,10,8];

/* ---------- state ---------- */
const blank=()=>({race:'',p2:'',p1:'',anc:'',cls:'',sub:'',level:0,method:'array',base:{str:15,dex:14,con:13,int:12,wis:10,cha:8},asi:{str:0,dex:0,con:0,int:0,wis:0,cha:0},featN:0,bg:'',bgSk:[],clsSk:[],raceSk:[],exp:[],picked:[],armor:'None',shield:false,w:['','',''],gear:'',cantrips:'',spells:'',extras:'',name:'',player:'',langs:'',look:'',story:'',card:{go:'',sig:'',emg:''}});
let S=blank(), PHASE='before', step_=0;
try{ const raw=localStorage.getItem('tbg-builder'); if(raw){ const o=JSON.parse(raw); S=Object.assign(blank(),o); S.base=Object.assign(blank().base,o.base||{}); S.asi=Object.assign(blank().asi,o.asi||{}); S.card=Object.assign(blank().card,o.card||{}); ['bgSk','clsSk','raceSk','exp','w','picked'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=blank()[k]; }); } }catch(e){ S=blank(); }
function persist(){ try{ localStorage.setItem('tbg-builder',JSON.stringify(S)); }catch(e){ $('#saveState').textContent='This browser is not saving your progress. Copy your character code before you leave.'; } }
const race=()=>RACES.find(r=>r.id===S.race);
const cls=()=>CLASSES.find(c=>c.id===S.cls);
const lvl=()=>Math.max(1,Math.min(20,parseInt(S.level,10)||(PHASE==='before'?15:1)));
const lineOf=r=>Array.isArray(r.line)?r.line[PHASE==='after'?1:0]:r.line;
function asiCount(){ const c=cls(), L=lvl(); if(!c) return 0; let ls=[4,8,12,16,19]; if(c.id==='fighter') ls=ls.concat([6,14]); if(c.id==='rogue') ls=ls.concat([10]); return ls.filter(x=>L>=x).length; }

/* ---------- the maths ---------- */
function calc(){
  const r=race(), c=cls(), L=lvl(), pb=2+Math.floor((L-1)/4), D={L,pb,ab:{},m:{}};
  ABS.forEach(([k])=>{ let v=(parseInt(S.base[k],10)||8)+(S.p2===k?2:0)+(S.p1===k?1:0)+(parseInt(S.asi[k],10)||0); let cap=20;
    if(c&&c.id==='barbarian'&&L>=20&&(k==='str'||k==='con')){ v+=4; cap=24; }
    D.ab[k]=Math.min(cap,v); D.m[k]=amod(D.ab[k]); });
  D.saves={}; ABS.forEach(([k])=>{ D.saves[k]=!!(c&&(c.saves.includes(k)||(c.id==='monk'&&L>=14)||(c.id==='rogue'&&L>=15&&k==='wis'))); });
  const bg=BGS.find(b=>b[0]===S.bg); D.bgSk=bg?(bg[0]==='Custom'?S.bgSk.slice(0,2):bg[1]):[];
  D.prof={}; D.bgSk.concat(S.clsSk,S.raceSk).forEach(s=>{ D.prof[s]=1; }); S.exp.forEach(s=>{ if(D.prof[s]) D.prof[s]=2; });
  D.skill=n=>{ const a=SKILLS.find(s=>s[0]===n)[1]; return D.m[a]+pb*(D.prof[n]||0); };
  /* hit points */
  const hd=c?c.hd:8;
  D.hp=Math.max(1,hd+D.m.con)+(L-1)*Math.max(1,hd/2+1+D.m.con)+(PHASE==='after'?Math.floor(D.ab.con/2):0);
  D.hd=L+'d'+hd;
  /* armor class */
  const ar=ARMOR.find(a=>a[0]===S.armor)||ARMOR[0], sh=S.shield?2:0; let ac, acNote;
  if(r&&r.id==='tortle'){ ac=17+sh; acNote='Natural armor'; }
  else if(ar[1]!=='none'){ ac=ar[2]+Math.min(D.m.dex,ar[3])+sh; acNote=ar[0]+(sh?' and shield':''); }
  else { const opts=[[10+D.m.dex+sh,'Unarmored'+(sh?' with shield':'')]];
    if(r&&r.id==='corrin') opts.push([13+D.m.dex+sh,'Stone body'+(sh?' with shield':'')]);
    if(c&&c.id==='barbarian') opts.push([10+D.m.dex+D.m.con+sh,'Unarmored Defense'+(sh?' with shield':'')]);
    if(c&&c.id==='monk'&&!sh) opts.push([10+D.m.dex+D.m.wis,'Unarmored Defense']);
    if(c&&c.id==='avenger'&&!sh) opts.push([10+D.m.dex+D.m.wis,'Armor of Faith']);
    if(c&&c.id==='warden') opts.push([10+D.m.dex+D.m.con+sh,'Guardian\'s Hide'+(sh?' with shield':'')]);
    opts.sort((a,b)=>b[0]-a[0]); ac=opts[0][0]; acNote=opts[0][1]; }
  if(c&&c.id==='swordmage'&&!sh&&!(r&&r.id==='tortle')){ ac+=L>=11?2:1; acNote+=', Swordmage Warding'; }
  D.ac=ac; D.acNote=acNote;
  /* speed */
  let walk=r?r.walk:30; const bare=ar[1]==='none';
  if(c&&c.id==='barbarian'&&L>=5&&ar[1]!=='heavy') walk+=10;
  if(c&&c.id==='monk'&&L>=2&&bare&&!S.shield) walk+=step(L,[[2,10],[6,15],[10,20],[14,25],[18,30]]);
  const sp=[walk+' ft']; if(r){ if(r.swim) sp.push('swim '+r.swim+' ft'); if(r.climb) sp.push('climb '+r.climb+' ft');
    if(r.id==='aarakocra'&&L>=2&&ar[1]!=='medium'&&ar[1]!=='heavy') sp.push('fly '+(L>=7?50:30)+' ft'); }
  D.speed=sp.join(', ');
  D.atk=!c?1:c.id==='fighter'?step(L,[[1,1],[5,2],[11,3],[20,4]]):(['barbarian','monk','paladin','ranger','warlord','swordmage','avenger','warden'].includes(c.id)&&L>=5?2:1);
  /* spellcasting */
  if(c&&c.cast&&!(c.cast.type==='half'&&L<2)){ const k=c.cast.ab, sc={ab:k,dc:8+pb+D.m[k],atk:pb+D.m[k]};
    if(c.cast.type==='pact'){ const p=PACT[L-1]; sc.slots=p[0]+' pact slot'+(p[0]>1?'s':'')+' of '+ORD[p[1]]+' level, back on a short rest'; }
    else { const eff=c.cast.type==='full'?L:Math.ceil(L/2); sc.slots=FULL[eff-1].map((n,i)=>ORD[i+1]+': '+n).join(', '); }
    if(c.cast.can) sc.can=step(L,c.cast.can);
    if(c.cast.prep) sc.count='Prepare '+Math.max(1,D.m[k]+(c.cast.prep==='full'?L:Math.floor(L/2)))+' spells each day';
    else if(c.cast.known) sc.count='You know '+c.cast.known[L-1]+' spells';
    sc.list=c.cast.list; sc.max=c.cast.type==='pact'?Math.min(9,Math.ceil(L/2)):FULL[(c.cast.type==='full'?L:Math.ceil(L/2))-1].length;
    D.cast=sc; }
  /* attacks */
  D.attacks=[];
  const add=(name,die,type,ab,prof,note)=>{ const m=D.m[ab]; D.attacks.push({name,roll:sgn(m+(prof?pb:0))+' to hit, '+die+(m?sgn(m):'')+' '+type,desc:(note?note+'. ':'')+(prof?'':'Not proficient. ')+'Uses '+ABN[ab]+'.'}); };
  const best=()=>D.m.dex>D.m.str?'dex':'str';
  S.w.forEach(n=>{ const w=WEAPONS.find(x=>x[0]===n); if(!w) return; const f=w[4]; const ab=f.includes('r')&&!f.includes('f')?'dex':f.includes('f')?best():(c&&c.id==='monk'&&(w[1]==='simple'||w[0]==='Shortsword')&&!/Two-handed|Heavy/.test(w[5])?best():'str');
    const prof=!!(c&&(c.weap.includes(w[1])||c.weap.includes(w[0]))); add(w[0],w[2],w[3],ab,prof,w[5]); });
  if(r&&r.nat) add(r.nat.name,r.nat.die,r.nat.type,r.nat.fin||(c&&c.id==='monk')?best():'str',true,'Natural weapon');
  if(c&&c.id==='monk') add('Unarmed strike','1d'+step(L,[[1,4],[5,6],[11,8],[17,10]]),'bludgeoning',best(),true,'Martial Arts');
  /* skill pick limits */
  D.nCls=c?c.n:0; D.nRace=r&&r.picks?r.picks.n:0;
  D.nExp=(c&&c.id==='rogue'?(L>=6?4:2):0)+(c&&c.id==='bard'?(L>=10?4:L>=3?2:0):0)+(r&&r.id==='human'&&L>=7?1:0);
  D.asiBudget=Math.max(0,2*(asiCount()-(parseInt(S.featN,10)||0)));
  D.asiSpent=ABS.reduce((t,[k])=>t+(parseInt(S.asi[k],10)||0),0);
  return D;
}

/* what the player guide's My character page stores */
function toHub(){
  const D=calc(), r=race(), c=cls(), L=D.L, opts=[]; let n=0;
  const push=(cat,name,cost,roll,max,desc)=>opts.push({id:'b'+(n++).toString(36)+Date.now().toString(36).slice(-4),cat,name,cost:cost||'Passive',roll:roll||'',max:Math.max(0,Math.min(12,max||0)),used:0,desc:desc||''});
  D.attacks.forEach(a=>push('Attack',a.name,'Action',a.roll,0,a.desc));
  if(r){ r.traits.forEach(t=>{ const o=t[2]||{}; if(o.min&&L<o.min) return;
      push('Ability',t[0],o.cost,o.roll?o.roll(L,D.pb,D):'',o.uses==='pb'?D.pb:(o.uses||0),t[1]+(PHASE==='after'&&o.after?o.after:'')+(t[0]==='Ancestry'&&S.anc?' Yours: '+S.anc+'.':'')); });
    if(L>=(r.upLvl||7)) push('Ability',r.name+' level '+(r.upLvl||7)+' upgrade','Passive','',0,r.up); }
  if(c){ c.feats.forEach(f=>{ if(L<f[0]) return; const txt=typeof f[3]==='function'?f[3](L,D):f[3]; const uses=typeof f[4]==='function'?f[4](L,D):(f[4]||0);
      push('Ability',f[1],f[2],f[5]?f[5](L,D):'',uses,txt); });
    if(D.atk>1) push('Ability','Extra Attack','Passive','',0,'You attack '+D.atk+' times whenever you take the Attack action.'); }
  if(D.cast) push('Spell','Spellcasting ('+ABN[D.cast.ab]+')','Passive','Save DC '+D.cast.dc+', '+sgn(D.cast.atk)+' to hit',0,'Slots: '+D.cast.slots+'.'+(D.cast.can?' Cantrips known: '+D.cast.can+'.':'')+(D.cast.count?' '+D.cast.count+'.':''));
  const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const split=x=>{ const i=x.indexOf(':'); return i>0?[x.slice(0,i).trim(),x.slice(i+1).trim()]:[x,'']; };
  S.picked.map(n=>SPBY[n]).filter(Boolean).sort((a,b)=>a.l-b.l||a.n.localeCompare(b.n)).forEach(x=>push('Spell',x.n,TIME[x.t]||'Action',(x.l?ORD[x.l]+' level':'Cantrip')+(x.f.includes('c')?', concentration':'')+(x.f.includes('r')?', ritual':'')+(TIME[x.t]?'':', casting time '+x.t),0,x.d));
  lines(S.cantrips).forEach(x=>{ const [a,b]=split(x); push('Spell',a,'Action','Cantrip',0,b); });
  lines(S.spells).forEach(x=>{ const [a,b]=split(x); push('Spell',a,'Action','',0,b); });
  lines(S.extras).forEach(x=>{ const [a,b]=split(x); push('Ability',a,'Passive','',0,b); });
  const sk={}; Object.keys(D.prof).forEach(k=>{ sk[k]=D.prof[k]; });
  const notes=[S.bg?'Background: '+S.bg:'', c?'Armor: '+c.armor+'. Weapons: '+c.weap.map(w=>w==='simple'?'simple weapons':w==='martial'?'martial weapons':w.toLowerCase()).join(', ')+'.':'', S.langs?'Languages: '+S.langs:'', D.cast?'Spell slots: '+D.cast.slots:'', S.look?'Appearance: '+S.look:'', S.story?'Story: '+S.story:''].filter(Boolean).join('\n\n');
  const gear=[S.armor!=='None'?S.armor:'', S.shield?'Shield':''].concat(S.w.filter(Boolean)).filter(Boolean).join(', ')+(S.gear?(S.armor!=='None'||S.shield||S.w.some(Boolean)?'\n':'')+S.gear:'');
  return {t:Date.now(),name:S.name,player:S.player,race:S.race,cls:c?c.name+(S.sub?' ('+S.sub+')':''):'',level:L,domain:'',tier:'',spark:'',faith:'',ab:D.ab,sv:D.saves,sk,ac:D.ac,hpMax:D.hp,hp:D.hp,temp:0,speed:D.speed,hd:D.hd,acts:1,bonus:1,react:1,atk:D.atk,card:S.card,options:opts,gear,notes};
}
const encode=o=>'TBG1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));

/* ---------- steps ---------- */
const STEPS=[['race','People'],['class','Class'],['abil','Abilities'],['skills','Skills'],['gear','Gear'],['spells','Spells'],['details','Details'],['sheet','Sheet'],['combat','Combat']];
function doneFlags(){ const D=calc(); return [!!S.race&&!!S.p2&&!!S.p1, !!S.cls, true, !!S.bg&&S.clsSk.length===D.nCls&&S.raceSk.length===D.nRace, true, true, !!S.name, false, false]; }
function renderTabs(){ const d=doneFlags(), bar=$('#tabs');
  if(!bar.children.length) bar.innerHTML=STEPS.map((s,i)=>`<button class="tab" role="tab" data-step="${i}">${s[1]}</button>`).join('');
  Array.from(bar.children).forEach((b,i)=>{ b.classList.toggle('done',!!d[i]); b.setAttribute('aria-selected',i===step_); }); }
function go(i){ step_=Math.max(0,Math.min(STEPS.length-1,i)); STEPS.forEach((s,j)=>{ $('#p-'+s[0]).hidden=j!==step_; });
  try{ localStorage.setItem('tbg-builder-step',String(step_)); }catch(e){}
  render(); $('#prev').hidden=step_===0; $('#next').hidden=step_===STEPS.length-1; $('#next').textContent=step_===6?'See my sheet':step_===7?'See my combat page':'Next';
  const v=$('#rv'); if(step_===0) playVid(); else v.pause(); }
function render(){ renderTabs(); [renderRace,renderClass,renderAbil,renderSkills,renderGear,renderSpells,renderDetails,renderSheet,renderCombat][step_](); }
const sel=(key,opts,val,ph)=>`<select data-s="${key}" id="f-${key.replace(/\./g,'-')}">${ph?`<option value="">${ph}</option>`:''}${opts.map(o=>{ const v=Array.isArray(o)?o[0]:o, t=Array.isArray(o)?o[1]:o; return `<option value="${esc(v)}"${String(v)===String(val)?' selected':''}>${esc(t)}</option>`; }).join('')}</select>`;

/* people */
let vidKey='';
function playVid(){ const r=race(), v=$('#rv'); if(!r){ return; }
  const base='v/'+r.vid+(r.two?'_'+PHASE:''); if(vidKey!==base){ vidKey=base; v.poster=base+'.jpg'; v.src=base+'.mp4'; v.load(); }
  $('#rvHint').hidden=true; $('#rvBtn').hidden=false;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ $('#rvBtn').textContent='Play'; return; }
  const p=v.play(); if(p&&p.catch) p.catch(()=>{ $('#rvBtn').textContent='Play'; }); $('#rvBtn').textContent='Pause'; }
function renderRace(){
  $('#rail').innerHTML=RACES.map(r=>`<button class="rc" data-race="${r.id}" aria-pressed="${r.id===S.race}"><img src="t/${r.vid}.jpg" alt="" loading="lazy" width="200" height="240"><span>${r.name}</span></button>`).join('');
  const r=race(); if(!r){ $('#raceInfo').innerHTML=''; return; }
  const L=lvl();
  $('#raceInfo').innerHTML=`<div class="plate"><h2 style="margin-top:0">${r.name}</h2><p class="lede">${esc(lineOf(r))}</p>
    <p class="who">${r.size}. Speed ${r.walk} ft${r.swim?', swim '+r.swim+' ft':''}${r.climb?', climb '+r.climb+' ft':''}${r.id==='aarakocra'?', fly 30 ft from level 2':''}.</p>
    <h4>Your choices</h4>
    <div class="fields">
      <label class="f">+2 to one ability${sel('p2',ABS,S.p2,'Choose')}</label>
      <label class="f">+1 to a different ability${sel('p1',ABS.filter(a=>a[0]!==S.p2),S.p1,'Choose')}</label>
      ${r.id==='dragonborn'?`<label class="f">Ancestry damage type${sel('anc',ANCESTRY,S.anc,'Choose')}</label>`:''}
    </div>
    ${r.picks?`<p class="who" style="margin-top:10px">You also pick ${r.picks.n} skill${r.picks.n>1?'s':''} from this people on the Skills step.</p>`:''}
  </div>
  <details open><summary>Full trait rules</summary><ul class="traits">
    ${r.traits.map(t=>`<li><b>${esc(t[0])}.</b> ${esc(t[1]+(PHASE==='after'&&t[2]&&t[2].after?t[2].after:''))}</li>`).join('')}
    <li><b>Level ${r.upLvl||7}.</b> ${esc(r.up)}</li></ul></details>`;
}

/* class */

  const c=cls(), L=lvl();
  let h=`<p class="lede">Choose a class and level.</p>
  <div class="plate"><div class="fields"><label class="f">Level${sel('level',Array.from({length:20},(_,i)=>i+1),L)}</label></div>
  <p class="who" style="margin-top:8px">${PHASE==='before'?'Your DM is running the opening one-shot at level 15.':'The campaign starts at level 1.'} Proficiency bonus ${sgn(2+Math.floor((L-1)/4))}.</p></div>
  <div class="cards" style="margin-top:16px">${CLASSES.map(x=>`<button class="cc" data-cls="${x.id}" aria-pressed="${x.id===S.cls}"><b>${x.name}</b><small>${x.src?'<span class="tag">'+x.src+'</span> ':''}d${x.hd} hit die. ${x.prim}.</small></button>`).join('')}</div>`;
  if(c){ const feats=c.feats.filter(f=>f[0]<=L), D=calc();
    h+=`<div class="grid g2" style="margin-top:16px"><div class="plate"><h3>${c.name}</h3>
      ${c.src?`<p class="who"><span class="tag">Converted from ${c.src}</span> ${esc(c.conv)} Your DM can adjust it.</p>`:''}
      <p class="who">Hit die d${c.hd}. Saving throws: ${c.saves.map(k=>ABN[k]).join(' and ')}.</p>
      <p class="who">Armor: ${c.armor}. Weapons: ${c.weap.map(w=>w==='simple'?'simple weapons':w==='martial'?'martial weapons':w.toLowerCase()).join(', ')}.</p>
      <p class="who">${c.cast?'Casts spells with '+ABN[c.cast.ab]+'.':'No spellcasting from the class itself.'}</p>
      ${L>=c.subAt?`<label class="f">${c.subName}<input data-s="sub" id="f-sub" list="subs" value="${esc(S.sub)}" autocomplete="off" placeholder="Choose or type your own"></label><datalist id="subs">${c.subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
      <p class="who" style="margin-top:8px">This builder lists the base class features. Add your ${c.subName.toLowerCase()} features on the Details step.</p>`:`<p class="who">You choose a ${c.subName.toLowerCase()} at level ${c.subAt}.</p>`}
    </div><div class="plate"><h3>Features at level ${L}</h3><ul class="traits">
      ${feats.map(f=>`<li><b>${esc(f[1])}</b> <span class="who">level ${f[0]}</span><br><span class="who">${esc(typeof f[3]==='function'?f[3](L,D):f[3])}</span></li>`).join('')}
      ${D.atk>1?`<li><b>Extra Attack</b><br><span class="who">You attack ${D.atk} times whenever you take the Attack action.</span></li>`:''}
      ${asiCount()?`<li><b>Ability Score Improvement</b><br><span class="who">${asiCount()} so far. Spend them on the Abilities step.</span></li>`:''}
    </ul></div></div>`; }
  $('#p-class').innerHTML=h;
}

/* abilities */
function renderAbil(){
  const D=calc(), r=race();
  const pts=ABS.reduce((t,[k])=>t+(COST[S.base[k]]==null?99:COST[S.base[k]]),0);
  const used={}; ABS.forEach(([k])=>{ used[S.base[k]]=(used[S.base[k]]||0)+1; });
  const dup=S.method==='array'&&ARRAY.some(v=>used[v]!==1);
  let h=`<p class="lede">Set your six ability scores.</p>
  <div class="plate"><div class="chips">${[['array','Standard array'],['buy','Point buy'],['manual','Rolled or custom']].map(m=>`<button class="chip" data-method="${m[0]}" aria-pressed="${S.method===m[0]}">${m[1]}</button>`).join('')}</div>
  <p class="who">${S.method==='array'?'Assign 15, 14, 13, 12, 10, and 8, one to each ability.'+(dup?' <span class="count bad">Each number should be used once.</span>':''):S.method==='buy'?`27 points to spend. Scores run from 8 to 15. <span class="count${pts>27?' bad':''}">${pts} of 27 spent.</span>`:'Type in the scores you rolled, or the ones your DM gave you.'}</p></div>
  <div class="abil" style="margin-top:16px">${ABS.map(([k,n])=>{ const bonus=(S.p2===k?2:0)+(S.p1===k?1:0);
    const input=S.method==='manual'?`<input type="number" min="3" max="18" data-s="base.${k}" data-num id="f-base-${k}" value="${esc(S.base[k])}">`:sel('base.'+k,S.method==='array'?ARRAY:[8,9,10,11,12,13,14,15],S.base[k]);
    return `<div class="ab"><label class="f">${n}${input}</label>
      <div class="tot">${D.ab[k]}<small>${sgn(D.m[k])}</small></div>
      <div class="parts">${bonus?'People +'+bonus+'. ':''}${D.asiBudget||S.asi[k]?`<label>Level-ups <input type="number" min="0" max="12" data-s="asi.${k}" data-num id="f-asi-${k}" value="${esc(S.asi[k]||0)}" style="width:64px;padding:2px 6px"></label>`:''}</div></div>`; }).join('')}</div>`;
  if(asiCount()) h+=`<div class="plate" style="margin-top:16px"><h3>Ability Score Improvements</h3>
    <p class="who">Your class has given you ${asiCount()} so far. Each is worth 2 points to add to your scores above (maximum 20), or you can trade one for a feat.</p>
    <div class="fields"><label class="f">Improvements traded for feats<input type="number" min="0" max="${asiCount()}" data-s="featN" data-num id="f-featN" value="${esc(S.featN||0)}"></label></div>
    <p class="count${D.asiSpent>D.asiBudget?' bad':''}" style="margin-top:8px">${D.asiSpent} of ${D.asiBudget} points placed.${(parseInt(S.featN,10)||0)?' Write your feats on the Details step.':''}</p></div>`;
  if(!r||!S.p2||!S.p1) h+=`<p class="warn">Your people give +2 to one ability and +1 to another. Choose them on the People step.</p>`;
  $('#p-abil').innerHTML=h;
}

/* skills */
function renderSkills(){
  const D=calc(), c=cls(), r=race(), taken=new Set(D.bgSk.concat(S.clsSk,S.raceSk));
  const group=(key,list,max,sel_)=>`<div class="chips">${list.map(s=>{ const on=sel_.includes(s), blocked=!on&&(taken.has(s)||sel_.length>=max); return `<button class="chip" data-pick="${key}" data-v="${esc(s)}" aria-pressed="${on}"${blocked?' disabled':''}>${esc(s)}</button>`; }).join('')}</div><p class="count${sel_.length!==max?' bad':''}">${sel_.length} of ${max} chosen.</p>`;
  let h=`<p class="lede">Choose a background and the skills you are trained in.</p>
  <div class="plate"><h3>Background</h3><div class="fields"><label class="f">Background${sel('bg',BGS.map(b=>b[0]),S.bg,'Choose')}</label></div>
  ${S.bg==='Custom'?`<p class="who" style="margin-top:10px">Pick any two skills.</p>${group('bgSk',ALLSK,2,S.bgSk)}`:S.bg?`<div class="chips">${D.bgSk.map(s=>`<span class="chip lock">${esc(s)}</span>`).join('')}</div>`:''}</div>`;
  h+=`<div class="plate" style="margin-top:16px"><h3>Class skills</h3>${c?`<p class="who">${c.name}: choose ${c.n}.</p>${group('clsSk',c.skills==='any'?ALLSK:c.skills,c.n,S.clsSk)}`:'<p class="who">Choose a class first.</p>'}</div>`;
  if(r&&r.picks) h+=`<div class="plate" style="margin-top:16px"><h3>${r.name} skills</h3><p class="who">Choose ${r.picks.n}.</p>${group('raceSk',r.picks.pool==='any'?ALLSK:r.picks.pool,r.picks.n,S.raceSk)}</div>`;
  if(D.nExp){ const prof=Object.keys(D.prof); h+=`<div class="plate" style="margin-top:16px"><h3>Expertise</h3><p class="who">Double your proficiency bonus in ${D.nExp} skill${D.nExp>1?'s':''} you are trained in.</p>
    <div class="chips">${prof.map(s=>{ const on=S.exp.includes(s); return `<button class="chip" data-pick="exp" data-v="${esc(s)}" aria-pressed="${on}"${!on&&S.exp.length>=D.nExp?' disabled':''}>${esc(s)}</button>`; }).join('')}</div><p class="count${S.exp.length!==D.nExp?' bad':''}">${S.exp.length} of ${D.nExp} chosen.</p></div>`; }
  h+=`<div class="plate" style="margin-top:16px"><h3>Your skill bonuses</h3><div class="sk">${SKILLS.map(([n,a])=>`<div class="${D.prof[n]?'p':''}"><span>${n} <small>${a}${D.prof[n]===2?', expertise':D.prof[n]?', trained':''}</small></span><b>${sgn(D.skill(n))}</b></div>`).join('')}</div></div>`;
  $('#p-skills').innerHTML=h;
}

let spQ='', spAll=false;
function spellRows(){
  const D=calc(); const list=D.cast?D.cast.list:'', max=D.cast?D.cast.max:9, q=spQ.trim().toLowerCase();
  const xs=SPELLS.filter(x=>(spAll||!list||x.c.includes(list))&&(spAll&&!D.cast?true:x.l<=max)&&(!q||x.n.toLowerCase().includes(q)||x.d.toLowerCase().includes(q)));
  if(!xs.length) return '<p class="who" style="padding:10px 12px;margin:0">No spells match. Clear the search, or add the spell by hand below.</p>';
  let h='', lv=-1;
  xs.forEach(x=>{ if(x.l!==lv){ lv=x.l; h+=`<div class="splv">${lv?ORD[lv]+' level':'Cantrips'}</div>`; }
    h+=`<button class="sp" data-spell="${esc(x.n)}" aria-pressed="${S.picked.includes(x.n)}"><b>${esc(x.n)}</b><small>${esc(TIME[x.t]||x.t)}${x.f.includes('c')?', concentration':''}${x.f.includes('r')?', ritual':''}</small><span>${esc(x.d)}</span></button>`; });
  return h;
}
function spellCount(){ const pk=S.picked.map(n=>SPBY[n]).filter(Boolean); const c0=pk.filter(x=>x.l===0).length; return c0+' cantrip'+(c0===1?'':'s')+' and '+(pk.length-c0)+' spell'+(pk.length-c0===1?'':'s')+' chosen.'; }

/* combat: the three-line card on the left, every option grouped by what it costs on the right */
let cF='All';
const TYPES=[['Action','Actions'],['Bonus action','Bonus actions'],['Reaction','Reactions'],['Free','Free, alongside something else'],['Passive','Always on']];
function combatList(C){
  const xs=C.options.filter(o=>cF==='All'||o.cost===cF); if(!C.options.length) return '<div class="plate"><p>Your attacks, abilities, and spells appear here once you choose a people and a class.</p></div>';
  if(!xs.length) return '<p class="who">Nothing on your list uses that kind of action.</p>';
  return TYPES.map(([k,label])=>{ const g=xs.filter(o=>o.cost===k); if(!g.length) return '';
    return `<h3 class="cat">${label} <small>${g.length}</small></h3>`+g.map(o=>`<div class="opt"><b>${esc(o.name)}</b><span class="badge">${esc(o.cat)}</span>${o.max?`<span class="badge">${o.max} use${o.max>1?'s':''}</span>`:''}${o.roll?` <span class="roll">${esc(o.roll)}</span>`:''}${o.desc?`<p>${esc(o.desc)}</p>`:''}</div>`).join(''); }).join('');
}
function renderCombat(){
  const D=calc(), C=toHub(), r=race();
  const pills=(label,n)=>Array.from({length:n},(_,i)=>`<button class="pill" aria-pressed="false">${label}${n>1?' '+(i+1):''}</button>`).join('');
  const count=k=>C.options.filter(o=>o.cost===k).length;
  $('#p-combat').innerHTML=`<p class="lede">Your turn at a glance. This same page is in the player guide once you import your code.</p>
  <div class="cgrid">
    <aside class="cleft"><div class="plate">
      <h3>${esc(S.name||'Unnamed character')}</h3><p class="who">Level ${D.L} ${r?esc(r.name):''} ${esc(C.cls)}</p>
      <div class="stats c3"><div class="stat"><b>${D.ac}</b>Armor class</div><div class="stat"><b>${D.hp}</b>Hit points</div><div class="stat"><b class="sm">${esc(D.speed.split(',')[0])}</b>Speed</div></div>
      <h4>This turn</h4>
      <p class="who">You get one of each. Select one when you have used it.</p>
      <div class="pills">${pills('Action',1)}${pills('Bonus action',1)}${pills('Reaction',1)}</div>
      <p class="who">Attacks per action <b style="color:var(--vellum)">${D.atk}</b></p>
      <p><button class="act" id="newTurn">Start a new turn</button></p>
      <h4>Combat card</h4>
      <p class="who">Three lines you can act on without reading your whole sheet.</p>
      <label class="f cardline">Go-to attack<input data-s="card.go" id="c-card-go" value="${esc(S.card.go)}" autocomplete="off" placeholder="What you do on most turns"></label>

      <div class="chips" style="margin-top:0">${[['All','Everything',C.options.length]].concat(TYPES.map(t=>[t[0],t[0]==='Free'?'Free':t[0]==='Passive'?'Always on':t[1],count(t[0])])).map(x=>`<button class="chip" data-cf="${x[0]}" aria-pressed="${x[0]===cF}">${x[1]} ${x[2]}</button>`).join('')}</div>
      <div id="cList">${combatList(C)}</div>

/* ---------- events ---------- */
function setPath(k,v){ const ps=k.split('.'); const l=ps.pop(); const t=ps.reduce((a,p)=>a[p],S); t[l]=v; }
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-step]'); if(t){ go(+t.dataset.step); window.scrollTo({top:0}); return; }
  const rc=e.target.closest('[data-race]'); if(rc){ if(S.race!==rc.dataset.race){ S.race=rc.dataset.race; S.raceSk=[]; S.anc=''; } persist(); render(); playVid(); return; }
  const cc=e.target.closest('[data-cls]'); if(cc){ if(S.cls!==cc.dataset.cls){ S.cls=cc.dataset.cls; S.sub=''; S.clsSk=[]; S.exp=[]; } persist(); render(); return; }
  const m=e.target.closest('[data-method]'); if(m){ S.method=m.dataset.method; if(S.method==='array'){ ABS.forEach(([k],i)=>{ S.base[k]=ARRAY[i]; }); } if(S.method==='buy'){ ABS.forEach(([k])=>{ S.base[k]=Math.max(8,Math.min(15,parseInt(S.base[k],10)||8)); }); } persist(); render(); return; }
  const pill=e.target.closest('.pill'); if(pill){ pill.setAttribute('aria-pressed',pill.getAttribute('aria-pressed')!=='true'); return; }
  if(e.target.id==='newTurn'){ document.querySelectorAll('#p-combat .pill').forEach(p=>p.setAttribute('aria-pressed','false')); return; }
  const cf=e.target.closest('[data-cf]'); if(cf){ cF=cf.dataset.cf; document.querySelectorAll('[data-cf]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cf===cF)); $('#cList').innerHTML=combatList(toHub()); return; }
  const spb=e.target.closest('[data-spell]'); if(spb){ const n=spb.dataset.spell, i=S.picked.indexOf(n); if(i>=0) S.picked.splice(i,1); else S.picked.push(n); spb.setAttribute('aria-pressed',i<0); $('#spCount').textContent=spellCount(); persist(); return; }
  const pk=e.target.closest('[data-pick]'); if(pk&&!pk.disabled){ const a=S[pk.dataset.pick], v=pk.dataset.v, i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v);
    S.exp=S.exp.filter(s=>calc().prof[s]); persist(); render(); return; }
  if(e.target.id==='prev'){ go(step_-1); window.scrollTo({top:0}); return; }
  if(e.target.id==='next'){ go(step_+1); window.scrollTo({top:0}); return; }
  if(e.target.id==='rvBtn'){ const v=$('#rv'); if(v.paused){ v.play(); e.target.textContent='Pause'; } else { v.pause(); e.target.textContent='Play'; } return; }
  if(e.target.id==='copy'){ const code=$('#code'), msg=$('#copyMsg'); const done=()=>{ msg.textContent='Copied.'; }, fail=()=>{ code.focus(); code.select(); msg.textContent='Select the code below and copy it.'; };
    try{ navigator.clipboard.writeText(code.value).then(done,fail); }catch(err){ fail(); } return; }
  if(e.target.id==='reset'){ $('#resetAsk').hidden=false; return; }
  if(e.target.id==='resetNo'){ $('#resetAsk').hidden=true; return; }
  if(e.target.id==='resetYes'){ S=blank(); vidKey=''; persist(); const v=$('#rv'); v.removeAttribute('src'); v.removeAttribute('poster'); v.load(); $('#rvHint').hidden=false; $('#rvBtn').hidden=true; go(0); window.scrollTo({top:0}); return; }
  const ph=e.target.closest('[data-phase]'); if(ph) setPhase(ph.dataset.phase);
});
function onField(e,commit){ const el=e.target, k=el.dataset&&el.dataset.s; if(!k) return;
  let v=el.type==='checkbox'?el.checked:el.value; if(el.hasAttribute('data-num')||/^base\./.test(k)||k==='level') v=v===''?'':Number(v);
  if(/^base\./.test(k)&&S.method==='array'){ const me=k.slice(5), old=S.base[me]; const other=ABS.map(a=>a[0]).find(x=>x!==me&&S.base[x]===v); if(other) S.base[other]=old; }
  setPath(k,v);
  if(k==='p2'&&S.p1===S.p2) S.p1='';
  if(k==='bg') S.bgSk=[];
  if(k==='bg'||k==='level'){ const tk=new Set(calc().bgSk); S.clsSk=S.clsSk.filter(s=>!tk.has(s)); S.raceSk=S.raceSk.filter(s=>!tk.has(s)); const D=calc(); S.exp=S.exp.filter(s=>D.prof[s]).slice(0,D.nExp); }
  persist();
  if(commit&&(el.tagName==='SELECT'||el.type==='checkbox'||el.type==='number')) render(); else renderTabs(); }
document.addEventListener('input',e=>{ if(e.target.id==='spQ'){ spQ=e.target.value; $('#spList').innerHTML=spellRows(); return; } onField(e,false); });
document.addEventListener('change',e=>{ if(e.target.id==='spAll'){ spAll=e.target.checked; $('#spList').innerHTML=spellRows(); return; } if(e.target.id==='spQ') return; onField(e,true); });

/* ---------- which videos players see: set by the DM, shared through the page's data store ---------- */
let cfgRef=null;
function applyPhase(p){ if(p!=='before'&&p!=='after') return; if(PHASE===p) { markPhase(); return; } PHASE=p; vidKey=''; markPhase(); render(); if(step_===0) playVid(); }
function markPhase(){ document.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.phase===PHASE)); }
async function setPhase(p){ const msg=$('#dmMsg'); if(!cfgRef){ msg.textContent='The shared setting is not available in this view.'; return; }
  try{ await cfgRef.set({phase:p}); applyPhase(p); msg.textContent=p==='before'?'Players now see the versions that keep the ending secret.':'Players now see the versions written for after the one-shot.'; }
  catch(err){ msg.textContent='That did not save. Try again in a moment.'; } }
(async function(){ try{
  if(!window.claude||!window.claude.use) return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(db){ cfgRef=db.doc('config/campaign'); cfgRef.onSnapshot(s=>{ const d=s.exists?s.data():null; if(d&&d.phase) applyPhase(d.phase); },()=>{}); }
  if(user&&await user.isOwner()){ $('#dmBox').hidden=false; markPhase(); }
}catch(e){} })();

/* ---------- start ---------- */
try{ step_=Math.max(0,Math.min(8,parseInt(localStorage.getItem('tbg-builder-step'),10)||0)); }catch(e){}
go(step_);
